<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Our little arcade — a map of the games we play">
    <title>Games — Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261008a">
</head>
<body class="page-sub theme-games">
    <div class="loader" id="loader">
        <div class="loader-text">
            <span class="loader-letter">L</span>
            <span class="loader-letter">o</span>
            <span class="loader-letter">a</span>
            <span class="loader-letter">d</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">g</span>
        </div>
    </div>

    <div class="theme-bg" id="themeBg"></div>
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <a href="index.html" class="back-btn">
        <span class="back-btn-arrow">&#8249;</span>
        <span>Back</span>
    </a>

    <nav class="nav" id="nav">
        <a href="index.html" class="nav-brand">
            <span class="nav-brand-mark">&#10022;</span>
            <span class="nav-brand-text">For You</span>
        </a>
        <div class="nav-links">
            <a href="card.html" class="nav-link">Card</a>
            <a href="moments.html" class="nav-link">Moments</a>
            <a href="message.html" class="nav-link">Letter</a>
            <a href="wish.html" class="nav-link">Wish</a>
            <a href="games.html" class="nav-link active">Games</a>
            <a href="musics.html" class="nav-link">Music</a>
            <a href="cards.html" class="nav-link">Cards</a>
        </div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
            <span class="sound-icon" id="soundIcon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </span>
        </button>
    </nav>

    <main class="games-page" id="gamesPage">
        <header class="games-masthead reveal-up">
            <span class="games-label">INSERT COIN &middot; PRESS START</span>
            <h1 class="games-title">The Arcade</h1>
            <p class="games-sub">我们的小小游戏世界 &mdash; 点开地图上的图钉，看看我们一起打过的仗。</p>
        </header>

        <!-- Isometric game world map -->
        <div class="game-map-stage reveal-up" style="--delay: 0.2s" id="gameMapStage">
            <div class="game-map-canvas" id="gameMapCanvas">
                <!-- Pins are rendered here by js/games.js -->
            </div>
            <div class="game-map-hint" id="gameMapHint">&#10022; 拖动漫游小岛 &middot; 滚轮缩放 &middot; Shift+拖动 / 双指旋转拉动视角</div>
        </div>

        <nav class="games-footer-nav reveal-up" style="--delay: 0.35s">
            <span class="games-credit">PLAYER 1 &middot; PLAYER 2 &mdash; CO-OP MODE</span>
            <a class="games-compare-link" href="games-3d.html">试试 3D 小岛小样 &rarr;</a>
        </nav>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">每一枚图钉，都是我们一起守过点的地方</p>
            <p class="footer-sub">&#10022; GG WP &mdash; see you in the next round</p>
        </div>
    </footer>

    <!-- Video lightbox (click a pin to open) -->
    <div class="game-video-lightbox" id="gameVideoLightbox" aria-hidden="true" hidden>
        <div class="game-video-scrim" id="gameVideoScrim"></div>
        <div class="game-video-panel" id="gameVideoPanel"></div>
        <button class="game-video-close" id="gameVideoClose" aria-label="Close (Esc)">&#10006;</button>
    </div>

    <script src="js/main.js?v=20261008a"></script>
    <script src="js/games.js?v=20261008a"></script>
</body>
</html>
