<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Places we've been together">
    <title>Moments — Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-sub theme-story">
    <div class="loader" id="loader">
        <div class="loader-text">
            <span class="loader-letter">L</span>
            <span class="loader-letter">o</span>
            <span class="loader-letter">a</span>
            <span class="loader-letter">d</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">g</span>
        </div>
    </div>

    <div class="theme-bg" id="themeBg"></div>
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <a href="index.html" class="back-btn">
        <span class="back-btn-arrow">&#8249;</span>
        <span>Back</span>
    </a>

    <nav class="nav" id="nav">
        <a href="index.html" class="nav-brand">
            <span class="nav-brand-mark">&#10022;</span>
            <span class="nav-brand-text">For You</span>
        </a>
        <div class="nav-links">
            <a href="card.html" class="nav-link">Card</a>
            <a href="moments.html" class="nav-link active">Moments</a>
            <a href="message.html" class="nav-link">Letter</a>
            <a href="wish.html" class="nav-link">Wish</a>
        </div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
            <span class="sound-icon" id="soundIcon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </span>
        </button>
    </nav>

    <!-- Hero -->
    <header class="sub-hero">
        <p class="sub-eyebrow reveal-up" style="--delay: 0.1s">Edition 02</p>
        <h1 class="sub-title reveal-up" style="--delay: 0.3s">Moments</h1>
        <p class="sub-subtitle reveal-up" style="--delay: 0.5s">我们一起走过的地方，每一步都算数。</p>
    </header>

    <!-- Journey Timeline (Railway) -->
    <section class="timeline-section" id="journeyTimeline">
        <div class="timeline-container">
            <!-- Header (shadcn-inspired bordered card) -->
            <div class="timeline-header">
                <span class="timeline-badge">Timeline</span>
                <div class="timeline-header-text">
                    <h2 class="timeline-title">我们的旅程</h2>
                    <p class="timeline-desc">从第一座山到最远的海洋，每一站都是我们的故事。点击任意站点，打开回忆。</p>
                </div>
            </div>
            <!-- Railway Timeline -->
            <div class="railway-timeline" id="railwayTimeline">
                <!-- Track -->
                <div class="railway-track">
                    <div class="rail rail-left"></div>
                    <div class="rail rail-right"></div>
                    <div class="railway-sleepers"></div>
                </div>
                <!-- Train (moves on scroll, positioned by JS) -->
                <div class="train" id="journeyTrain">
                    <svg viewBox="0 0 200 62" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="trainBody" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#f0e8e0"/>
                                <stop offset="45%" stop-color="#d8ccc4"/>
                                <stop offset="100%" stop-color="#b8aca0"/>
                            </linearGradient>
                            <linearGradient id="trainStripe" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#c9a06a"/>
                                <stop offset="100%" stop-color="#b88e8a"/>
                            </linearGradient>
                            <linearGradient id="trainWindow" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="rgba(180,220,255,0.35)"/>
                                <stop offset="100%" stop-color="rgba(120,160,200,0.2)"/>
                            </linearGradient>
                        </defs>
                        <!-- Body -->
                        <path d="M8,44 Q8,18 38,14 L120,11 Q160,11 175,24 L185,33 Q188,38 185,44 Z" fill="url(#trainBody)"/>
                        <!-- Top accent stripe -->
                        <path d="M8,20 Q8,18 38,14 L120,11 Q160,11 175,24 L175,27 Q160,15 120,15 L38,18 Q10,22 10,24 Z" fill="url(#trainStripe)" opacity="0.7"/>
                        <!-- Window strip background -->
                        <rect x="20" y="21" width="135" height="11" rx="2" fill="rgba(20,20,30,0.2)"/>
                        <!-- Windows -->
                        <rect x="23" y="23" width="18" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <rect x="45" y="23" width="18" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <rect x="67" y="23" width="18" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <rect x="89" y="23" width="18" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <rect x="111" y="23" width="18" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <rect x="133" y="23" width="14" height="7" rx="1.5" fill="url(#trainWindow)"/>
                        <!-- Cockpit window -->
                        <path d="M150,21 Q163,23 175,29 L177,35 L150,35 Z" fill="url(#trainWindow)"/>
                        <!-- Headlight -->
                        <circle cx="180" cy="36" r="2.5" fill="#fff8e0"/>
                        <circle cx="180" cy="36" r="7" fill="#fff8e0" opacity="0.2"/>
                        <!-- Bottom accent line -->
                        <rect x="8" y="41" width="170" height="3" fill="url(#trainStripe)" opacity="0.5"/>
                        <!-- Text -->
                        <text x="85" y="38" font-size="3.5" fill="rgba(80,60,40,0.35)" text-anchor="middle" font-family="sans-serif">CR400AF</text>
                    </svg>
                </div>
                <!-- Stations (generated by JS) -->
                <div class="stations" id="stationsList"></div>
            </div>
            <!-- Footer cap -->
            <div class="timeline-footer"></div>
        </div>
    </section>

    <!-- Journey Map -->
    <section class="journey-map-section" id="journeyMapSection">
        <div class="section-header">
            <span class="section-number">02</span>
            <h2 class="section-title">Map</h2>
        </div>
        <div class="journey-map-wrap">
            <svg class="journey-map" id="journeyMap" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <defs>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <!-- Journey path (drawn by JS) -->
                <path class="journey-path" id="journeyPath" d="" fill="none" stroke="rgba(201,169,166,0.4)" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round"/>
                <!-- Locations (generated by JS) -->
                <g id="journeyLocations"></g>
            </svg>
            <p class="journey-map-hint">点击星标，打开回忆</p>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">Crafted with love</p>
            <p class="footer-sub">&#10022; For someone who deserves the stars</p>
        </div>
    </footer>

    <!-- Picture-in-Picture Windows Container -->
    <div class="pip-container" id="pipContainer"></div>

    <script src="js/main.js"></script>
</body>
</html>
