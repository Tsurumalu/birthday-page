<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Little moments, and what they meant to me — a scroll-driven polaroid line">
    <title>Moments — Happy Birthday</title>
    <link rel="stylesheet" href="css/fonts.css?v=20261019a">
    <link rel="stylesheet" href="css/style.css?v=20261019p">
</head>
<body class="page-sub theme-stamp">
    <div class="loader" id="loader">
        <div class="loader-text">
            <span class="loader-letter">L</span>
            <span class="loader-letter">o</span>
            <span class="loader-letter">a</span>
            <span class="loader-letter">d</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">g</span>
        </div>
    </div>

    <div class="theme-bg" id="themeBg"></div>
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <a href="index.html" class="back-btn">
        <span class="back-btn-arrow">&#8249;</span>
        <span>Back</span>
    </a>

    <nav class="nav" id="nav">
        <a href="index.html" class="nav-brand">
            <span class="nav-brand-mark">&#10022;</span>
            <span class="nav-brand-text">For You</span>
        </a>
        <div class="nav-links">
            <a href="moments.html" class="nav-link active">Moments</a>
            <a href="message.html" class="nav-link">Letter</a>
            <a href="games-3d.html" class="nav-link">Games</a>
            <a href="musics.html" class="nav-link">Music</a>
            <a href="cards.html" class="nav-link">Cards</a>
        </div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
            <span class="sound-icon" id="soundIcon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </span>
        </button>
    </nav>

    <!-- Hero (compact) -->
    <header class="stamp-hero stamp-hero-compact">
        <p class="stamp-eyebrow reveal-up" style="--delay: 0.1s">Edition 02 &middot; 2026</p>
        <h1 class="stamp-title reveal-up" style="--delay: 0.25s">我们的瞬间</h1>
        <p class="stamp-subtitle reveal-up" style="--delay: 0.45s">
            一些想留住的瞬间，一些想说的话。<br>
            向下滚动，照片会沿着绳子一张张滑过来。
        </p>
    </header>

    <!-- Moments Stage (scroll-driven polaroid clothesline) -->
    <section class="journey-stage" id="journeyStage">
        <!-- Huge poster typography in the background -->
        <div class="journey-poster" aria-hidden="true">
            <div class="journey-poster-line">我们的瞬间</div>
            <div class="journey-poster-line journey-poster-line-alt">OUR · MOMENTS</div>
        </div>

        <!-- Prints pegged to a sagging string; scroll slides the whole line -->
        <div class="pl-line" id="polaroidLine" tabindex="0" role="region"
             aria-roledescription="carousel" aria-label="我们的瞬间">
            <svg class="pl-string" id="plString" aria-hidden="true">
                <path id="plStringPath" fill="none" stroke-linecap="round" />
            </svg>
            <div class="pl-cards" id="plCards"></div>
            <div class="pl-bar">
                <div class="pl-cap" id="plCap" aria-hidden="true"></div>
                <span class="pl-count" id="plCount" aria-hidden="true"></span>
                <button type="button" class="pl-btn" id="plPrev" aria-label="Previous moment">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.4" />
                    </svg>
                </button>
                <button type="button" class="pl-btn" id="plNext" aria-label="Next moment">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.4" />
                    </svg>
                </button>
            </div>
            <div class="pl-sr" id="plSr" aria-live="polite"></div>
        </div>

        <!-- Railway progress bar (fixed at bottom of viewport) -->
        <div class="journey-rail-bar" id="journeyRailBar" aria-hidden="true">
            <div class="rail-bar-line">
                <div class="rail-bar-sleepers"></div>
                <div class="rail-bar-train" id="railBarTrain">
                    <svg viewBox="0 0 200 62" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="railBarBody" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#fdfbf5"/>
                                <stop offset="45%" stop-color="#dcd2c6"/>
                                <stop offset="100%" stop-color="#b9ab9c"/>
                            </linearGradient>
                            <linearGradient id="railBarStripe" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#c0553f"/>
                                <stop offset="100%" stop-color="#d98a76"/>
                            </linearGradient>
                            <linearGradient id="railBarWindow" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="rgba(60,80,110,0.45)"/>
                                <stop offset="100%" stop-color="rgba(40,60,90,0.28)"/>
                            </linearGradient>
                        </defs>
                        <path d="M8,44 Q8,18 38,14 L120,11 Q160,11 175,24 L185,33 Q188,38 185,44 Z" fill="url(#railBarBody)"/>
                        <path d="M8,20 Q8,18 38,14 L120,11 Q160,11 175,24 L175,27 Q160,15 120,15 L38,18 Q10,22 10,24 Z" fill="url(#railBarStripe)" opacity="0.75"/>
                        <rect x="20" y="21" width="135" height="11" rx="2" fill="rgba(30,28,26,0.22)"/>
                        <rect x="23" y="23" width="18" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <rect x="45" y="23" width="18" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <rect x="67" y="23" width="18" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <rect x="89" y="23" width="18" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <rect x="111" y="23" width="18" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <rect x="133" y="23" width="14" height="7" rx="1.5" fill="url(#railBarWindow)"/>
                        <path d="M150,21 Q163,23 175,29 L177,35 L150,35 Z" fill="url(#railBarWindow)"/>
                        <circle cx="180" cy="36" r="2.5" fill="#fff8e0"/>
                        <circle cx="180" cy="36" r="7" fill="#fff8e0" opacity="0.22"/>
                        <rect x="8" y="41" width="170" height="3" fill="url(#railBarStripe)" opacity="0.55"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Scroll hint -->
        <div class="journey-hint" id="journeyHint">
            <span class="journey-hint-dot"></span>
            <span class="journey-hint-text">Scroll to begin</span>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">每一张照片，都是我想留住的瞬间</p>
            <p class="footer-sub">&#10022; For someone who deserves the stars</p>
        </div>
    </footer>

    <script src="js/tracks-core.js?v=20261017a"></script>
    <script src="js/mini-player.js?v=20261017c"></script>
    <script src="js/main.js?v=20261019d"></script>
</body>
</html>
