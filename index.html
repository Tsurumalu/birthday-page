<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A birthday gift, in five editions.">
    <title>Happy Birthday — Choose an edition</title>
    <link rel="stylesheet" href="css/fonts.css?v=20261019a">
    <link rel="stylesheet" href="css/style.css?v=20261019p">
</head>
<body class="page-home theme-story">
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-text">
            <span class="loader-letter">L</span>
            <span class="loader-letter">o</span>
            <span class="loader-letter">a</span>
            <span class="loader-letter">d</span>
            <span class="loader-letter">i</span>
            <span class="loader-letter">n</span>
            <span class="loader-letter">g</span>
        </div>
    </div>

    <!-- Theme Background -->
    <div class="theme-bg" id="themeBg"></div>
    <canvas class="confetti-canvas" id="confettiCanvas"></canvas>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <a href="index.html" class="nav-brand">
            <span class="nav-brand-mark">&#10022;</span>
            <span class="nav-brand-text">For You</span>
        </a>
        <div class="nav-links">
            <a href="moments.html" class="nav-link">Moments</a>
            <a href="message.html" class="nav-link">Letter</a>
            <a href="games-3d.html" class="nav-link">Games</a>
            <a href="musics.html" class="nav-link">Music</a>
            <a href="cards.html" class="nav-link">Cards</a>
        </div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound">
            <span class="sound-icon" id="soundIcon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                    <line x1="23" y1="9" x2="17" y2="15"/>
                    <line x1="17" y1="9" x2="23" y2="15"/>
                </svg>
            </span>
        </button>
    </nav>

    <!-- Keyboard / drag hints -->
    <div class="home-tools">
        <p class="home-tools-line">
            Drag the dial or <span class="k">&#8592;</span><span class="k">&#8594;</span> to turn
        </p>
        <p class="home-tools-line">
            <span class="k">&#8629;</span> Enter
            <span class="home-tools-sep">&middot;</span>
            <button class="k" id="randomBtn" type="button" title="Randomise edition">R</button>
            Randomise
        </p>
    </div>

    <!-- Home / Chooser -->
    <main class="home" id="home">
        <div class="home-layout">
            <div class="home-info">
                <div class="home-kicker reveal-up" style="--delay: 0.1s">
                    <p class="home-kicker-name">Happy Birthday</p>
                    <p class="home-kicker-text">
                        A birthday gift, assembled by hand. Five editions — pick one and
                        turn the dial to meet the day.
                    </p>
                </div>
                <h1 class="home-title reveal-up" id="homeTitle" style="--delay: 0.25s">Moments</h1>
                <p class="home-title-cn reveal-up" id="homeTitleCn" style="--delay: 0.32s">时光</p>
                <p class="home-tagline reveal-up" id="homeTagline" style="--delay: 0.4s">
                    The chapters of us, from the beginning.
                </p>
            </div>

            <div class="home-dial-wrap reveal-up" style="--delay: 0.55s">
                <div class="dial-stage">
                    <div class="dial-arrows">
                        <button class="dial-arrow" id="arrowLeft" aria-label="Previous edition">&#8249;</button>
                        <div class="dial-pointer"></div>
                        <button class="dial-arrow" id="arrowRight" aria-label="Next edition">&#8250;</button>
                    </div>

                    <div class="dial" id="dial" tabindex="0" role="group" aria-label="Birthday gift edition selector">
                        <div class="dial-rotor" id="dialRotor">
                            <svg class="dial-segments" id="dialSegments" viewBox="0 0 400 400" aria-hidden="true"></svg>
                            <div class="dial-labels" id="dialLabels"></div>
                        </div>
                        <!-- Lens barrel etching — static ring between rotor and iris -->
                        <svg class="dial-etch" viewBox="0 0 400 400" aria-hidden="true">
                            <defs>
                                <path id="etchArcTop" d="M 86,200 A 114,114 0 0 1 314,200"></path>
                                <path id="etchArcBottom" d="M 86,200 A 114,114 0 0 0 314,200"></path>
                            </defs>
                            <circle class="etch-ring" cx="200" cy="200" r="100"></circle>
                            <circle class="etch-ring etch-ring--faint" cx="200" cy="200" r="124"></circle>
                            <text class="etch-text"><textPath href="#etchArcTop" startOffset="50%" text-anchor="middle"><tspan class="etch-en">FOR YOU</tspan><tspan class="etch-cn"> · 为你</tspan></textPath></text>
                            <text class="etch-text etch-text--cn"><textPath href="#etchArcBottom" startOffset="50%" text-anchor="middle">生日快乐</textPath></text>
                        </svg>
                        <!-- Aperture blades — sits over the hub, centre hole opens/closes -->
                        <div class="dial-iris is-closed" id="dialIris">
                            <svg class="iris-blades" id="irisBlades" viewBox="0 0 200 200" aria-hidden="true"></svg>
                        </div>
                        <button class="dial-hub-btn" id="dialHub" aria-label="Enter selected edition">
                            <span class="dial-hub-notch"></span>
                            <span class="dial-hub-count" id="dialCount">01 / 05</span>
                            <span class="dial-hub-label">Enter</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/tracks-core.js?v=20261017a"></script>
    <script src="js/mini-player.js?v=20261017c"></script>
    <script src="js/main.js?v=20261019d"></script>
</body>
</html>
